<div class="container mt-5 text-center">

    <h2 class="fw-bold text-primary mb-4">Juego de Memoria</h2>

    <div class="row justify-content-center">

        <div class="col-3 col-sm-2 col-lg-2 col-xl-2 justify-content-center aling-items-center p-2 p-md-3 p-lg-4 "
            [ngClass]="{
            tableroActivo : intentando,
            tableroInactivo : !intentando
        }" *ngFor="let carta of cartas">

            <div class="card carta p-0 board-card" [class.flipped]="carta.visible || carta.encontrada"
                (click)="mostrarCarta(carta)">

                <div class="card-body p-0 card-inner">

                    <!-- Frente -->
                    <div class="card-front">
                        <img [src]="carta.img" class="img-carta" alt="Carta">
                    </div>

                    <!-- Dorso -->
                    <div class="card-back">
                        <img src="assets/images/Punto3/dorso.jpg"
                        class="img-carta" alt="Carta">
                    </div>

                </div>

            </div>

        </div>

    </div>
    <div class="container mt-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">

            <!-- Intentos -->
            <div class="text-center text-md-start">
                <h5 class="fw-bold mb-0">
                    Intentos: {{intentos}}
                </h5>
            </div>

            <!-- Mensaje -->
            <p class="mb-0 text-muted">
                {{mensaje}}
            </p>

            <!-- Botones -->
            <div class="d-flex gap-2">
                <button class="btn" [ngClass]="{
                    'btn-primary': !jugando,
                    'btn-danger': jugando,
                }" (click)="iniciarJuego()">
                    {{botonInicio}}
                </button>

                <button class="btn" [class.deshabilitado]="bloqueado" [ngClass]="{
                    'btn-danger': !jugando && !intentando,
                    'btn-success': jugando && !intentando,
                    'btn-secondary' : intentando
                }" (click)="intentar()">
                    Intentar
                </button>
            </div>

        </div>

    </div>


</div>
